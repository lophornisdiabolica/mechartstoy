name: Desktop app

# Builds the Windows installer for the desktop app (Tauri). Run it from the
# Actions tab ("Run workflow"), or push to a branch that touches src-tauri/.
# The installer is attached to the run as "mech-battle-windows".
on:
  workflow_dispatch:
  push:
    paths:
      - 'src-tauri/**'
      - '.github/workflows/desktop.yml'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: mech-battle-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
